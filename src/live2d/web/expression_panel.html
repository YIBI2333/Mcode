function setP(pid, on){
 var p=null;
 for(var s in sections){ for(var j=0;j<sections[s].length;j++){ if(sections[s][j][0]===pid){p=sections[s][j];break}} if(p)break }
 if(!p)return;
 var v=on?(expVals[pid]!==undefined?expVals[pid]:0.5):0;
 states[pid]=on;
 var el=inp[pid];
 if(el){el.s.value=v;el.n.textContent=Number(v).toFixed(2);el.tog.textContent=on?'ON':'OFF';el.tog.className=on?'on':'off';el.row.className=on?'r on':'r'}
 S.setPetParam(pid,v);
}

function buildUI(){
 var c=document.getElementById('ct');c.innerHTML='';
 for(var s in sections){
  var items=sections[s];
  if(!items.length)continue;
  var d=document.createElement('div');d.className='t';
  d.innerHTML='<div class=tt>'+s+' ('+items.length+')</div>';
  for(var j=0;j<items.length;j++){
   var it=items[j],pid=it[0],lb=it[1],lo=it[2],hi=it[3],st=it[4];
   var isExp=expVals[pid]!==undefined;
   states[pid]=false;
   var r=document.createElement('div');r.className='r';
   var pref=isExp?'* ':'';
   r.innerHTML='<label>'+pref+lb+'</label><span class=pid>'+pid+'</span><input type=range min='+lo+' max='+hi+' step='+st+' value=0><span class=nv>0.00</span><button class=off>OFF</button>';
   var sl=r.querySelector('input[type=range]'),nv=r.querySelector('.nv'),tog=r.querySelector('button');
   inp[pid]={s:sl,n:nv,tog:tog,row:r};
   sl.addEventListener('input',function(p,l,h){return function(){var x=parseFloat(this.value)||0;nv.textContent=Number(x).toFixed(2);states[p]=x>0.001;tog.textContent=states[p]?'ON':'OFF';tog.className=states[p]?'on':'off';r.className=states[p]?'r on':'r';S.setPetParam(p,x)}}(pid,lo,hi));
   tog.addEventListener('click',function(p){return function(){setP(p,!states[p])}}(pid));
   d.appendChild(r);
  }
  c.appendChild(d);
 }
}

document.getElementById('all-on').addEventListener('click',function(){for(var s in sections)for(var j=0;j<sections[s].length;j++)setP(sections[s][j][0],true)});

function updateBlinkBtn(on){

 blinkBtn.style.background=on?'rgba(76,175,80,0.2)':'rgba(244,67,54,0.15)';
}

 S.onAutoBlinkChanged(function(on){updateBlinkBtn(on)});
 S.getAutoBlink().then(function(v){updateBlinkBtn(v)}).catch(function(){});
}catch(_){}

  for(var pid in persisted){
   if(!persisted.hasOwnProperty(pid)) continue;
   var v=persisted[pid];
   states[pid]=v!==0&&v!==undefined;
   var el=inp[pid];
   if(el){

    el.tog.className=states[pid]?'on':'off';
